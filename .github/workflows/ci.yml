name: CI

on:
  pull_request:
    # `labeled`: the label `ci:compose` starts the compose smoke test on any PR.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# Cancel superseded runs of the same PR; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api-client: ${{ steps.filter.outputs.api-client }}
      e2e: ${{ steps.filter.outputs.e2e }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On push events paths-filter diffs against the previous commit via git.
          # Without full history it would have to fetch it, which fails without credentials.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A file counts for a filter only if it matches every pattern of it: one brace
          # list of paths plus exclusions. Markdown changes (READMEs) never start a job.
          predicate-quantifier: every
          filters: |
            backend:
              - '{backend/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            frontend:
              - '{frontend/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            # Any backend change can alter the OpenAPI schema; also the generated files and
            # the generator itself (its version is pinned by the lockfile).
            api-client:
              - '{backend/**,frontend/src/api/**,frontend/package.json,frontend/pnpm-lock.yaml,frontend/.pnpmfile.cjs,.github/workflows/ci.yml}'
              - '!**/*.md'
            e2e:
              - '{backend/**,frontend/**,.github/workflows/ci.yml}'
              - '!**/*.md'
            # Images and the Compose stack, including the dependencies baked into the images.
            compose:
              - '{deploy/**,backend/Dockerfile,backend/.dockerignore,backend/pyproject.toml,backend/uv.lock,frontend/Dockerfile,frontend/.dockerignore,frontend/caddy/**,frontend/package.json,frontend/pnpm-lock.yaml,scripts/check-image-pins.sh,scripts/truenas-app.sh,.github/workflows/ci.yml}'
              - '!**/*.md'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ollamail
          POSTGRES_PASSWORD: ollamail
          POSTGRES_DB: ollamail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ollamail -d ollamail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # IMAP test server for the mail sync integration tests (tests/mail/imap_server.py).
      dovecot:
        image: dovecot/dovecot:2.4.5
        env:
          USER_PASSWORD: ollamail-test
        ports:
          - 31143:31143
          - 31993:31993
      # SMTP test server for sending replies (tests/mail/smtp_server.py): STARTTLS required
      # with a self-generated certificate, any login accepted, messages readable via its API.
      mailpit:
        image: axllent/mailpit:v1.31.3
        env:
          MP_SMTP_TLS_CERT: sans:localhost
          MP_SMTP_TLS_KEY: sans:localhost
          MP_SMTP_REQUIRE_STARTTLS: "true"
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
        ports:
          - 31025:1025
          - 31080:8025
    env:
      OLLAMAIL_DATABASE_URL: postgresql+asyncpg://ollamail:ollamail@localhost:5432/ollamail_test
      OLLAMAIL_TEST_IMAP_PASSWORD: ollamail-test
      OLLAMAIL_TEST_REQUIRE_IMAP: "1"
      OLLAMAIL_TEST_REQUIRE_SMTP: "1"
      # Dovecot and Mailpit listen on localhost; mail connections refuse internal addresses
      # without an allowlist entry (app/mail/providers/network.py).
      OLLAMAIL_MAIL_ALLOWED_INTERNAL_HOSTS: localhost,127.0.0.0/8,::1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Keycloak for the SAML integration tests (tests/auth/saml/test_keycloak.py); it
      # starts while the dependencies install. Not a service: it needs the start-dev command.
      - name: Start Keycloak
        run: >-
          docker run -d --name keycloak -p 8180:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          quay.io/keycloak/keycloak:26.6.0 start-dev
      - name: Install dependencies
        run: uv sync --locked
      # LDAP integration tests start their own slapd (tests/auth/ldap/slapd.py). The package
      # also starts a system server and confines slapd to /etc/ldap and /var/lib/ldap.
      - name: Install OpenLDAP server
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends slapd
          sudo systemctl disable --now slapd
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true
      # OCR tests run the real Tesseract (tests/search/test_ocr.py), as in the image.
      - name: Install Tesseract
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy app
      - name: Wait for Keycloak
        run: timeout 180 bash -c 'until curl -sf http://localhost:8180/realms/master >/dev/null; do sleep 2; done'
      - name: Test
        run: uv run pytest
        env:
          OLLAMAIL_TEST_REQUIRE_LDAP: "1"
          OLLAMAIL_TEST_REQUIRE_KEYCLOAK: "1"
          OLLAMAIL_TEST_REQUIRE_TESSERACT: "1"
          # Inbox and triage lists with 100k messages (tests/perf, #140).
          OLLAMAIL_TEST_PERF: "1"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # The committed OpenAPI schema and the generated client (frontend/src/api) must match the
  # backend. Fix a failure with `pnpm gen:api` in frontend/ and commit the result.
  api-client:
    name: API client up to date
    needs: changes
    if: needs.changes.outputs.api-client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate schema and client
        working-directory: frontend
        run: pnpm gen:api
      - name: Check for differences
        run: |
          if [ -n "$(git status --porcelain -- frontend/src/api)" ]; then
            git status --short -- frontend/src/api
            git --no-pager diff --stat -- frontend/src/api
            echo "::error::The generated API client is out of date. Run 'pnpm gen:api' in frontend/ and commit the result."
            exit 1
          fi

  # Playwright suite (frontend/e2e): mocked specs plus the flows against the real backend,
  # worker, PostgreSQL and the Dovecot test server (setup, login, IMAP mailbox, inbox, tasks,
  # search). No LLM: triage and embeddings fail fast and are retried later, the full-text
  # search works without them. Only synthetic data.
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ollamail
          POSTGRES_PASSWORD: ollamail
          POSTGRES_DB: ollamail_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ollamail -d ollamail_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dovecot:
        image: dovecot/dovecot:2.4.5
        env:
          USER_PASSWORD: ollamail-test
        ports:
          - 31993:31993
    env:
      OLLAMAIL_DATABASE_URL: postgresql+asyncpg://ollamail:ollamail@localhost:5432/ollamail_e2e
      OLLAMAIL_AUTH_COOKIE_SECURE: "false"
      # The test server uses a self-signed certificate.
      OLLAMAIL_MAIL_ALLOW_INSECURE_CONNECTIONS: "true"
      # Dovecot listens on localhost, an internal address that needs an allowlist entry.
      OLLAMAIL_MAIL_ALLOWED_INTERNAL_HOSTS: localhost,127.0.0.0/8,::1
      # Nothing listens there: LLM calls fail immediately instead of waiting for a timeout.
      OLLAMAIL_LLM_BASE_URL: http://127.0.0.1:9
      OLLAMAIL_TTS_DOWNLOAD_VOICES: "false"
      OLLAMAIL_DIGEST_ENABLED: "false"
      E2E_API: "1"
      E2E_IMAP: "1"
      E2E_PREVIEW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Generated per run, never stored: master key and setup token of the test instance.
      - name: Generate test secrets
        run: |
          key="$(openssl rand -base64 32)"
          token="$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          echo "::add-mask::$token"
          {
            echo "OLLAMAIL_SECRET_KEY=$key"
            echo "OLLAMAIL_SETUP_TOKEN=$token"
            echo "E2E_SETUP_TOKEN=$token"
            echo "OLLAMAIL_DATA_DIR=$RUNNER_TEMP/ollamail-data"
            echo "E2E_LOGS=$RUNNER_TEMP/e2e-logs"
          } >> "$GITHUB_ENV"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        working-directory: frontend
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps --only-shell chromium
          fi
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Migrate database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Start API and worker
        working-directory: backend
        run: |
          mkdir -p "$OLLAMAIL_DATA_DIR" "$E2E_LOGS"
          nohup uv run uvicorn app.main:app --port 8000 > "$E2E_LOGS/api.log" 2>&1 &
          echo $! > "$E2E_LOGS/api.pid"
          nohup uv run python -m app.worker > "$E2E_LOGS/worker.log" 2>&1 &
          echo $! > "$E2E_LOGS/worker.pid"
      # Polls readiness instead of sleeping a fixed time; gives up after 60 s.
      - name: Wait for the API
        run: |
          timeout 60 bash -c 'until curl -fsS http://localhost:8000/readyz; do sleep 1; done'
          kill -0 "$(cat "$E2E_LOGS/worker.pid")"
      - name: Run Playwright
        working-directory: frontend
        run: pnpm e2e
      - name: Check that the worker is still running
        if: always()
        run: kill -0 "$(cat "$E2E_LOGS/worker.pid")"
      # Traces and logs only contain synthetic test data; the secrets are not logged.
      - name: Upload report and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/e2e-logs/*.log
          retention-days: 7

  # Builds both images and starts deploy/compose.yaml as in production (no Ollama), then
  # checks UI, API, migrations and worker. Runs for changes to images, their dependencies or
  # deploy/, and on PRs with the label `ci:compose`. A full image build costs several runner
  # minutes, so it no longer runs on every push to main.
  compose:
    name: Compose smoke test
    needs: changes
    if: >-
      needs.changes.outputs.compose == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'ci:compose')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot bumps the third-party images only in compose.yaml; the copies must follow.
      - name: Image pins match compose.yaml
        run: ../scripts/check-image-pins.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same cache scopes as the release build (amd64), so main warms the cache for PRs.
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          provenance: false
          sbom: false
          tags: ollamail-api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          provenance: false
          sbom: false
          tags: ollamail-frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # deploy/.env from .env.example with generated secrets; never stored or uploaded.
      - name: Write test configuration
        run: |
          key="$(openssl rand -base64 32)"
          db_password="$(openssl rand -hex 16)"
          token="$(openssl rand -hex 16)"
          metrics_token="$(openssl rand -hex 16)"
          echo "::add-mask::$key"
          echo "::add-mask::$db_password"
          echo "::add-mask::$token"
          echo "::add-mask::$metrics_token"
          sed \
            -e "s|^OLLAMAIL_SECRET_KEY=.*|OLLAMAIL_SECRET_KEY=$key|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$db_password|" \
            -e "s|^OLLAMAIL_SETUP_TOKEN=.*|OLLAMAIL_SETUP_TOKEN=$token|" \
            -e "s|^OLLAMAIL_TTS_DOWNLOAD_VOICES=.*|OLLAMAIL_TTS_DOWNLOAD_VOICES=false|" \
            -e "s|^OLLAMAIL_HTTP_BIND=.*|OLLAMAIL_HTTP_BIND=127.0.0.1|" \
            -e "s|^OLLAMAIL_AUTH_IP_MAX_ATTEMPTS=.*|OLLAMAIL_AUTH_IP_MAX_ATTEMPTS=5|" \
            -e "s|^OLLAMAIL_METRICS_ENABLED=.*|OLLAMAIL_METRICS_ENABLED=true|" \
            -e "s|^OLLAMAIL_METRICS_TOKEN=.*|OLLAMAIL_METRICS_TOKEN=$metrics_token|" \
            .env.example > .env
          grep -q '^OLLAMAIL_SECRET_KEY=..*' .env
          docker compose config --quiet
      # --wait: until postgres and api are healthy, migrate has exited successfully and
      # worker/frontend are running; fails if a container exits or stays unhealthy.
      - name: Start stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Check UI, API and worker
        run: |
          base=http://127.0.0.1:8080
          # Polls a condition every 2 s for up to 60 s instead of sleeping a fixed time.
          wait_for() {
            local deadline=$((SECONDS + 60))
            until "${@:2}"; do
              if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::$1"; return 1; fi
              sleep 2
            done
          }
          ready() { curl -fsS -o /dev/null "$base/api/readyz"; }
          # The worker registers itself with a heartbeat once it consumes jobs.
          worker_registered() {
            local count
            count="$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM procrastinate_workers WHERE last_heartbeat > now() - interval '\''1 minute'\''"')"
            [ "$count" -ge 1 ]
          }

          wait_for "/api/readyz is not ready (database, migrations)" ready
          health="$(curl -fsS "$base/api/healthz")"
          echo "healthz: $health"
          [ "$health" = '{"status":"ok"}' ]
          for path in / /inbox; do
            page="$(curl -fsS "$base$path")"
            grep -q '<div id="root">' <<< "$page" || { echo "::error::$path is not index.html"; exit 1; }
          done
          migrate="$(docker compose ps --all --format '{{.ExitCode}}' migrate)"
          [ "$migrate" = 0 ] || { echo "::error::migrate exited with $migrate"; exit 1; }
          wait_for "the worker does not report a heartbeat" worker_registered
          # Running and never restarted (a crash loop also shows up as "running").
          for service in api worker frontend; do
            state="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$(docker compose ps -q "$service")")"
            echo "$service: $state"
            [ "$state" = "running 0" ] || { echo "::error::$service is not running stably"; exit 1; }
          done
          health="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q worker)")"
          [ "$health" = healthy ] || { echo "::error::worker healthcheck: $health"; exit 1; }
      # #146: /metrics only inside the Compose network and only with the token.
      - name: Metrics are internal and need the token
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/metrics)"
          [ "$code" = 404 ] || { echo "::error::/api/metrics is reachable through the proxy ($code)"; exit 1; }
          # Python inside the containers: the token never appears on a command line.
          scrape() {
            docker compose exec -T "$1" python -c '
          import os, sys, urllib.error, urllib.request
          request = urllib.request.Request(sys.argv[1])
          if sys.argv[2] == "token":
              request.add_header("Authorization", "Bearer " + os.environ["OLLAMAIL_METRICS_TOKEN"])
          try:
              print(urllib.request.urlopen(request, timeout=10).read().decode())
          except urllib.error.HTTPError as error:
              print(error.code)
          ' "$2" "$3"
          }
          [ "$(scrape api http://127.0.0.1:8000/metrics none)" = 401 ] || { echo "::error::api metrics without token"; exit 1; }
          api="$(scrape api http://127.0.0.1:8000/metrics token)"
          grep -q '^ollamail_metrics_database_up 1.0$' <<< "$api"
          grep -q '^# TYPE ollamail_queue_jobs gauge$' <<< "$api"
          [ "$(scrape worker http://127.0.0.1:9464/metrics none)" = 401 ] || { echo "::error::worker metrics without token"; exit 1; }
          grep -q '^python_info' <<< "$(scrape worker http://127.0.0.1:9464/metrics token)"
      # #192: the published frontend reaches only the api (network `edge`); postgres sits on
      # the internal network `backend` without a route outside, the api has outbound access.
      - name: Networks are separated
        run: |
          reach() { docker compose exec -T "$1" sh -c "nc -z -w 3 $2 $3" > /dev/null 2>&1; }
          outbound() { docker compose exec -T "$1" bash -c 'timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/443"' > /dev/null 2>&1; }
          reach frontend api 8000 || { echo "::error::frontend cannot reach api"; exit 1; }
          for target in "postgres 5432" "worker 9464"; do
            # shellcheck disable=SC2086
            if reach frontend $target; then echo "::error::frontend reaches $target"; exit 1; fi
          done
          if outbound postgres; then echo "::error::postgres has outbound access"; exit 1; fi
          outbound api || { echo "::error::api has no outbound access"; exit 1; }
      # #147: JSON under /api is compressed; Server-Sent Events are neither compressed nor
      # buffered by the internal Caddy.
      - name: API compression spares Server-Sent Events
        run: |
          base=http://127.0.0.1:8080
          # JSON is compressed (Caddy skips bodies under 512 bytes; the OpenAPI schema is large).
          headers="$(curl -fsS -o /dev/null -D - -H 'Accept-Encoding: zstd, gzip' "$base/api/openapi.json")"
          grep -qi '^content-encoding: \(zstd\|gzip\)' <<< "$headers" || { echo "::error::API JSON is not compressed"; exit 1; }
          # Server-Sent Events need a session: the first admin of this throwaway stack.
          jar="$RUNNER_TEMP/admin-cookies.txt"
          curl -fsS -o /dev/null -c "$jar" "$base/api/healthz"
          csrf="$(awk '$6 == "ollamail_csrf" { print $7 }' "$jar")"
          token="$(sed -n 's/^OLLAMAIL_SETUP_TOKEN=//p' .env)"
          curl -fsS -o /dev/null -b "$jar" -c "$jar" "$base/api/setup" \
            -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
            --data "{\"setup_token\":\"$token\",\"email\":\"smoke-admin@example.org\",\"display_name\":\"Smoke\",\"password\":\"smoke-test-password\"}"
          # Neither compressed nor buffered: the first line (`retry:`) arrives at once. curl
          # ends with 28 (timeout) on the open stream.
          set +e
          curl -sS -N --max-time 5 -D "$RUNNER_TEMP/sse-headers.txt" -o "$RUNNER_TEMP/sse-body.txt" \
            -b "$jar" -H 'Accept-Encoding: zstd, gzip' "$base/api/events"
          code=$?
          set -e
          cat "$RUNNER_TEMP/sse-headers.txt"
          [ "$code" = 28 ] || { echo "::error::the event stream ended early (curl $code)"; exit 1; }
          grep -qi '^content-type: text/event-stream' "$RUNNER_TEMP/sse-headers.txt" || { echo "::error::no event stream"; exit 1; }
          if grep -qi '^content-encoding:' "$RUNNER_TEMP/sse-headers.txt"; then
            echo "::error::the event stream is compressed"; exit 1
          fi
          grep -q '^retry:' "$RUNNER_TEMP/sse-body.txt" || { echo "::error::the event stream is buffered"; exit 1; }
      # #137: the runner acts as an outer proxy that appends the real client IP to a value
      # the client forged. Varying the forged part must not yield a fresh IP bucket.
      - name: Forged X-Forwarded-For does not bypass the login IP limit
        run: |
          base=http://127.0.0.1:8080
          jar="$RUNNER_TEMP/cookies.txt"
          curl -fsS -o /dev/null -c "$jar" "$base/api/healthz"
          csrf="$(awk '$6 == "ollamail_csrf" { print $7 }' "$jar")"
          [ -n "$csrf" ] || { echo "::error::no CSRF cookie"; exit 1; }
          attempt() {
            curl -sS -o /dev/null -w '%{http_code}' "$base/api/auth/login" \
              -H "Cookie: ollamail_csrf=$csrf" -H "X-CSRF-Token: $csrf" \
              -H 'Content-Type: application/json' -H "X-Forwarded-For: $1" \
              --data "{\"email\":\"smoke$2@example.org\",\"password\":\"wrong-password-1\"}"
          }
          for i in 1 2 3 4 5; do
            code="$(attempt "203.0.113.$i, 198.51.100.7" "$i")"
            [ "$code" = 401 ] || { echo "::error::attempt $i: expected 401, got $code"; exit 1; }
          done
          code="$(attempt "203.0.113.99, 198.51.100.7" 6)"
          [ "$code" = 429 ] || { echo "::error::forged X-Forwarded-For bypassed the IP limit ($code)"; exit 1; }
          # Another real client IP still has its own bucket.
          code="$(attempt "203.0.113.1, 198.51.100.8" 7)"
          [ "$code" = 401 ] || { echo "::error::other client IP: expected 401, got $code"; exit 1; }
      # Guards the check above: the api must refuse to start without a master key.
      - name: API refuses to start without a master key
        run: |
          set +e
          output="$(timeout 60 docker compose run --rm --no-deps -e OLLAMAIL_SECRET_KEY= api 2>&1)"
          code=$?
          set -e
          echo "exit code: $code"
          [ "$code" -ne 0 ] && [ "$code" -ne 124 ]
          grep -q secret_key_invalid <<< "$output"
      # #217: deploy/truenas/compose.yaml as pasted into TrueNAS (Install via YAML): own project
      # name, no .env, placeholders replaced, datasets as host directories owned by the TrueNAS
      # apps user (568). The images built above stand in for the GHCR tags.
      - name: TrueNAS custom app
        run: |
          docker compose down --volumes
          docker tag ollamail-api:local ghcr.io/dusseligerdussel/ollamail-api:edge
          docker tag ollamail-frontend:local ghcr.io/dusseligerdussel/ollamail-frontend:edge
          dir="$RUNNER_TEMP/truenas"
          pool="$dir/pool"
          # $dir stays the runner's (the rendered YAML goes there); only the datasets are 568's.
          mkdir -p "$dir"
          sudo mkdir -p "$pool"/ollamail/{postgres,data,ollama}
          sudo chown -R 568:568 "$pool/ollamail"
          tn() { docker compose -p ix-ollamail -f "$dir/compose.yaml" "$@"; }

          # Unchanged placeholders: the permissions one-shot refuses, nothing else starts.
          sed "s|/mnt/CHANGEME_POOL|$pool|g" truenas/compose.yaml > "$dir/compose.yaml"
          if tn up --detach --pull never --wait --wait-timeout 60 postgres; then
            echo "::error::the stack started with CHANGEME placeholders"; exit 1
          fi
          tn logs permissions | grep -q 'replace every CHANGEME value' || { echo "::error::no placeholder message"; exit 1; }
          tn down --volumes

          # Same secrets as deploy/.env, so the log collection below redacts them.
          key="$(sed -n 's/^OLLAMAIL_SECRET_KEY=//p' .env)"
          db_password="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)"
          sed -e "s|/mnt/CHANGEME_POOL|$pool|g" -e "s|CHANGEME_SECRET_KEY|$key|" \
            -e "s|CHANGEME_DB_PASSWORD|$db_password|g" truenas/compose.yaml > "$dir/compose.yaml"
          if grep -v '^ *#' "$dir/compose.yaml" | grep -q 'CHANGEME_'; then echo "::error::placeholder left"; exit 1; fi
          # TTS voices would be downloaded on start; not needed here.
          sed -i 's|^  # Further settings from deploy/.env.example go here.*|  OLLAMAIL_TTS_DOWNLOAD_VOICES: "false"|' "$dir/compose.yaml"
          grep -q '^  OLLAMAIL_TTS_DOWNLOAD_VOICES: "false"$' "$dir/compose.yaml"
          # Bundled Ollama stays off (large image, no models in CI).
          tn up --detach --pull never --wait --wait-timeout 180 frontend worker

          base=http://127.0.0.1:30580
          deadline=$((SECONDS + 60))
          until curl -fsS -o /dev/null "$base/api/readyz"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::/api/readyz is not ready"; exit 1; }
            sleep 2
          done
          [ "$(curl -fsS "$base/api/healthz")" = '{"status":"ok"}' ]
          grep -q '<div id="root">' <<< "$(curl -fsS "$base/")"
          [ "$(tn ps --all --format '{{.ExitCode}}' migrate)" = 0 ]
          [ "$(tn ps --all --format '{{.ExitCode}}' permissions)" = 0 ]
          for service in api worker frontend; do
            state="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$(tn ps -q "$service")")"
            echo "$service: $state"
            [ "$state" = "running 0" ] || { echo "::error::$service is not running stably"; exit 1; }
          done
          # The api wrote to /data as UID 10001; postgres owns its data directory.
          owner="$(stat -c %u:%g "$pool/ollamail/data")"
          [ "$owner" = 10001:10001 ] || { echo "::error::data is owned by $owner"; exit 1; }
          [ "$(sudo stat -c %u "$pool/ollamail/postgres/pgdata")" = 999 ]
          # Networks as in deploy/compose.yaml.
          reach() { tn exec -T "$1" sh -c "nc -z -w 3 $2 $3" > /dev/null 2>&1; }
          outbound() { tn exec -T "$1" bash -c 'timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/443"' > /dev/null 2>&1; }
          reach frontend api 8000 || { echo "::error::frontend cannot reach api"; exit 1; }
          if reach frontend postgres 5432; then echo "::error::frontend reaches postgres"; exit 1; fi
          if outbound postgres; then echo "::error::postgres has outbound access"; exit 1; fi
          outbound api || { echo "::error::api has no outbound access"; exit 1; }
          tn down --volumes
      # #217: the catalog app (deploy/truenas/app) validated and rendered with the pinned
      # truenas/apps tooling, then started like their CI does (ix volumes under /opt/tests).
      - name: TrueNAS catalog app
        run: |
          ../scripts/truenas-app.sh "$RUNNER_TEMP/truenas-app"
          sudo rm -rf /opt/tests/mnt
          app() { docker compose -p ix-ollamail-catalog -f "$RUNNER_TEMP/truenas-app/basic-values.yaml" "$@"; }
          app up --detach --pull missing --wait --wait-timeout 180 frontend worker
          base=http://127.0.0.1:8080
          deadline=$((SECONDS + 60))
          until curl -fsS -o /dev/null "$base/api/readyz"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::/api/readyz is not ready"; exit 1; }
            sleep 2
          done
          [ "$(curl -fsS "$base/api/healthz")" = '{"status":"ok"}' ]
          grep -q '<div id="root">' <<< "$(curl -fsS "$base/")"
          [ "$(app ps --all --format '{{.ExitCode}}' migrate)" = 0 ]
          owner="$(stat -c %u:%g /opt/tests/mnt/data)"
          [ "$owner" = 10001:10001 ] || { echo "::error::data is owned by $owner"; exit 1; }
          if app exec -T postgres bash -c 'timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/443"' > /dev/null 2>&1; then
            echo "::error::postgres has outbound access"; exit 1
          fi
          app down --volumes
      # Container output only (no `docker inspect`, which would include the environment);
      # the generated secrets are redacted as well in case anything echoes them.
      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/compose-logs"
          docker compose ps --all > "$RUNNER_TEMP/compose-logs/ps.txt" 2>&1 || true
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/compose-logs/compose.log" 2>&1 || true
          # TrueNAS stacks (#217), if a step left them running.
          stack_logs() {
            [ -f "$2" ] || return 0
            docker compose -p "$1" -f "$2" logs --no-color --timestamps > "$RUNNER_TEMP/compose-logs/$1.log" 2>&1 || true
          }
          stack_logs ix-ollamail "$RUNNER_TEMP/truenas/compose.yaml"
          stack_logs ix-ollamail-catalog "$RUNNER_TEMP/truenas-app/basic-values.yaml"
          for name in OLLAMAIL_SECRET_KEY POSTGRES_PASSWORD OLLAMAIL_SETUP_TOKEN; do
            value="$(sed -n "s/^$name=//p" .env)"
            [ -n "$value" ] || continue
            VALUE="$value" perl -pi -e 's/\Q$ENV{VALUE}\E/[redacted]/g' "$RUNNER_TEMP"/compose-logs/*
          done
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs
          path: ${{ runner.temp }}/compose-logs/
          retention-days: 7

  # Single required check: fails if any needed job failed or was cancelled,
  # passes if jobs were skipped by the path filter.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, frontend, api-client, e2e, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: >-
            changes=${{ needs.changes.result }}
            backend=${{ needs.backend.result }}
            frontend=${{ needs.frontend.result }}
            api-client=${{ needs.api-client.result }}
            e2e=${{ needs.e2e.result }}
            compose=${{ needs.compose.result }}
        run: |
          echo "Job results: $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
