name: Security

# Dependency audits (pip-audit, pnpm audit) and CodeQL. Not part of `ci-ok`: a new CVE in a
# dependency must not block unrelated PRs. Findings show up as a red run here (audits) or as
# code scanning alerts (CodeQL); Dependabot opens the update PRs (.github/dependabot.yml).
#
#   - weekly schedule -> everything
#   - lockfile change -> only the audit of the changed side (PR and main)
#   - manual run      -> everything
on:
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  # Schedule and manual runs check everything; PRs and pushes only what changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
      codeql: ${{ steps.result.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.github/workflows/security.yml'
            frontend:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - '.github/workflows/security.yml'
            # CodeQL analyses the code, not the dependencies: on PRs and pushes only when
            # this workflow changes, otherwise weekly.
            codeql:
              - '.github/workflows/security.yml'
      - name: Result
        id: result
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          CODEQL: ${{ steps.filter.outputs.codeql }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            BACKEND=true FRONTEND=true CODEQL=true
          fi
          {
            echo "backend=${BACKEND:-false}"
            echo "frontend=${FRONTEND:-false}"
            echo "codeql=${CODEQL:-false}"
          } | tee -a "$GITHUB_OUTPUT"

  # Every dependency group of uv.lock (runtime and dev tools), resolved exactly as locked.
  # Known, unfixable findings: `--ignore-vuln <ID>` below, each with a comment explaining why.
  pip-audit:
    name: pip-audit (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: backend
          enable-cache: false
      - name: Export requirements
        working-directory: backend
        run: uv export --frozen --all-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
      - name: Audit
        run: |
          uvx "pip-audit@${PIP_AUDIT_VERSION}" --requirement "$RUNNER_TEMP/requirements.txt" \
            --no-deps --disable-pip --progress-spinner off --desc on

  # Runtime dependencies only: dev tools (Vite, Vitest, Biome) are not shipped in the image.
  pnpm-audit:
    name: pnpm audit (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      # Reads pnpm-lock.yaml only, nothing is installed.
      - name: Audit
        run: pnpm audit --prod

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
