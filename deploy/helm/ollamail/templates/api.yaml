{{- include "ollamail.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollamail.fullname" . }}-api
  labels:
    {{- include "ollamail.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ollamail.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ollamail.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ollamail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "ollamail.podCommon" . | nindent 6 }}
      containers:
        - name: api
          {{- include "ollamail.backendImage" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "ollamail.backendEnv" (dict "root" .) | nindent 10 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "ollamail.backendVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "ollamail.backendVolumes" . | nindent 8 }}
      {{- with (include "ollamail.scheduling" .Values.api) }}{{ trim . | nindent 6 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ollamail.fullname" . }}-api
  labels:
    {{- include "ollamail.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ollamail.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
