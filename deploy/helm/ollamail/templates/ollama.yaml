{{- if .Values.ollama.enabled }}
{{- $fullname := include "ollamail.fullname" . }}
{{- with .Values.ollama }}
{{- if and .persistence.enabled (not .persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-ollama
  labels:
    {{- include "ollamail.componentLabels" (dict "root" $ "component" "ollama") | nindent 4 }}
  annotations:
    # Downloaded models survive `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .persistence.accessModes | nindent 4 }}
  {{- with .persistence.storageClass }}
  storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-ollama
  labels:
    {{- include "ollamail.componentLabels" (dict "root" $ "component" "ollama") | nindent 4 }}
spec:
  replicas: 1
  # Models live on one volume; never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ollamail.componentSelectorLabels" (dict "root" $ "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ollamail.componentLabels" (dict "root" $ "component" "ollama") | nindent 8 }}
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      containers:
        - name: ollama
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          securityContext:
            {{- toYaml .containerSecurityContext | nindent 12 }}
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:{{ .service.port }}"
            # Runs as non-root: keep the server key and the models on the volume.
            - name: HOME
              value: /ollama
            - name: OLLAMA_MODELS
              value: /ollama/models
            {{- with .extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- $resources := deepCopy .resources }}
            {{- if .gpu.enabled }}
            {{- $limits := default dict $resources.limits }}
            {{- $_ := set $limits .gpu.resourceName .gpu.count }}
            {{- $_ := set $resources "limits" $limits }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          {{- if .persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-ollama" $fullname) .persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with (include "ollamail.scheduling" .) }}{{ trim . | nindent 6 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ollama
  labels:
    {{- include "ollamail.componentLabels" (dict "root" $ "component" "ollama") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ollamail.componentSelectorLabels" (dict "root" $ "component" "ollama") | nindent 4 }}
{{- end }}
{{- end }}
