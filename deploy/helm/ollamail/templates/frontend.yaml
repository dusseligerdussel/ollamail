{{- include "ollamail.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ollamail.fullname" . }}-frontend
  labels:
    {{- include "ollamail.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "ollamail.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ollamail.componentLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with .Values.frontend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ollamail.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "ollamail.podCommon" . | nindent 6 }}
      containers:
        - name: frontend
          {{- include "ollamail.frontendImage" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # Caddy proxies /api/* (prefix stripped) to this upstream (frontend/caddy/Caddyfile).
            - name: OLLAMAIL_API_UPSTREAM
              value: "{{ include "ollamail.fullname" . }}-api:{{ .Values.api.service.port }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.frontend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.frontend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # Caddy keeps its state below /tmp (XDG_* in frontend/Dockerfile).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (include "ollamail.scheduling" .Values.frontend) }}{{ trim . | nindent 6 }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ollamail.fullname" . }}-frontend
  labels:
    {{- include "ollamail.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ollamail.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
