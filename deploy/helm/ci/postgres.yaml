# Test database for the kind install test (.github/workflows/helm.yml): PostgreSQL 16 with
# pgvector, without persistence. Not for production; use an external database or
# CloudNativePG (docs/operations/kubernetes.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16-bookworm
          env:
            - name: POSTGRES_USER
              value: ollamail
            - name: POSTGRES_PASSWORD
              value: ollamail-ci
            - name: POSTGRES_DB
              value: ollamail
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ollamail", "-d", "ollamail"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
