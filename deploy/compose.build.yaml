# ollamail – build the images locally instead of pulling them from GHCR.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml up -d --build
#
# Useful without GHCR access (private package) or to run unreleased changes.

services:
  migrate:
    build:
      context: ../backend
    image: ollamail-api:local

  api:
    build:
      context: ../backend
    image: ollamail-api:local

  worker:
    build:
      context: ../backend
    image: ollamail-api:local

  frontend:
    build:
      context: ../frontend
    image: ollamail-frontend:local
