{% set tpl = ix_lib.base.render.Render(values) %}

{# Same network split as deploy/compose.yaml (deploy/README.md#netze): `edge` connects the
   published frontend with the api only, `backend` carries postgres and ollama and has no route
   outside (set below, the library has no switch for it), `egress` is the way out for api,
   worker and ollama (mail servers, identity providers, LLM endpoints, model downloads). #}
{% set edge_net = tpl.networks.create_internal("edge") %}
{% set backend_net = tpl.networks.create_internal("backend") %}
{% set egress_net = tpl.networks.create_internal("egress") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set app_perms = {"uid": values.consts.app_user, "gid": values.consts.app_group, "mode": "check"} %}

{# pgvector tuning as in deploy/compose.yaml (docs/OPERATIONS.md section 8.4). #}
{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.ollamail.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
  "max_connections": 200,
  "additional_options": {
    "shared_buffers": "512MB",
    "effective_cache_size": "2GB",
    "maintenance_work_mem": "512MB",
    "work_mem": "16MB",
  },
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, "postgres_image", pg_config, perm_container) %}
{% do postgres.container.add_network(backend_net) %}
{# Parallel HNSW index builds need /dev/shm >= maintenance_work_mem. #}
{% do postgres.container.set_shm_size_mb(1024) %}

{% set db_url = postgres.get_url("postgresql").replace("postgresql://", "postgresql+asyncpg://", 1).replace("?sslmode=disable", "") %}
{% set bundled_ollama = values.ollamail.llm_mode == "bundled" %}
{% set llm_base_url = "http://%s:11434"|format(values.consts.ollama_container_name) if bundled_ollama else values.ollamail.llm_base_url %}

{# migrate, api and worker share the image, the settings and /data. #}
{% macro backend_container(c) %}
  {% do c.set_user(values.consts.app_user, values.consts.app_group) %}
  {% do c.set_read_only(True) %}
  {% do c.remove_devices() %}
  {% do c.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"uid": values.consts.app_user, "gid": values.consts.app_group}}) %}
  {% do c.add_storage(values.consts.data_path, values.storage.data) %}
  {% do c.add_network(backend_net) %}
  {% do c.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
  {% do c.environment.add_env("OLLAMAIL_SECRET_KEY", values.ollamail.secret_key) %}
  {% do c.environment.add_env("OLLAMAIL_DATABASE_URL", db_url) %}
  {% do c.environment.add_env("OLLAMAIL_DATA_DIR", values.consts.data_path) %}
  {% do c.environment.add_env("OLLAMAIL_LLM_BASE_URL", llm_base_url) %}
  {% do c.environment.add_env("OLLAMAIL_LLM_PROFILE", values.ollamail.llm_profile) %}
  {% do c.environment.add_env("OLLAMAIL_AUTH_COOKIE_SECURE", values.ollamail.cookie_secure) %}
  {% if values.ollamail.public_url %}
    {% do c.environment.add_env("OLLAMAIL_AUTH_PUBLIC_URL", values.ollamail.public_url) %}
  {% endif %}
  {% do c.environment.add_user_envs(values.ollamail.additional_envs) %}
{% endmacro %}

{# One-shot: applies database migrations before api and worker start. #}
{% set migrate = tpl.add_container(values.consts.migrate_container_name, "image") %}
{{ backend_container(migrate) }}
{% do migrate.set_command(["alembic", "upgrade", "head"]) %}
{% do migrate.restart.set_policy("on-failure", 1) %}
{% do migrate.healthcheck.disable() %}

{% set api = tpl.add_container(values.consts.api_container_name, "image") %}
{{ backend_container(api) }}
{% do api.add_network(edge_net) %}
{% do api.add_network(egress_net) %}
{% do api.depends.add_dependency(values.consts.migrate_container_name, "service_completed_successfully") %}
{% do api.healthcheck.set_custom_test(["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]) %}

{# Background jobs; running jobs get OLLAMAIL_WORKER_SHUTDOWN_TIMEOUT (30 s) on stop. #}
{% set worker = tpl.add_container(values.consts.worker_container_name, "image") %}
{{ backend_container(worker) }}
{% do worker.add_network(egress_net) %}
{% do worker.depends.add_dependency(values.consts.migrate_container_name, "service_completed_successfully") %}
{% do worker.set_command(["python", "-m", "app.worker"]) %}
{% do worker.set_grace_period(45) %}
{% do worker.healthcheck.set_custom_test(["CMD", "python", "-m", "app.core.heartbeat"]) %}
{% do worker.healthcheck.set_interval(30) %}
{% do worker.healthcheck.set_start_period(30) %}

{# The only published port: plain HTTP, TLS terminates in a reverse proxy in front. #}
{% set frontend = tpl.add_container(values.consts.frontend_container_name, "frontend_image") %}
{% do frontend.set_user(values.consts.app_user, values.consts.app_group) %}
{% do frontend.set_read_only(True) %}
{% do frontend.remove_devices() %}
{% do frontend.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"uid": values.consts.app_user, "gid": values.consts.app_group}}) %}
{% do frontend.add_network(edge_net) %}
{% do frontend.add_port(values.network.web_port, {"container_port": values.consts.frontend_port}) %}
{% do frontend.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}
{% do frontend.environment.add_env("OLLAMAIL_HSTS", values.ollamail.hsts) %}
{% do frontend.healthcheck.set_test("wget", {"port": values.consts.frontend_port, "path": "/"}) %}

{% if bundled_ollama %}
  {# Ollama has no authentication: only api and worker reach it (network `backend`). The
     upstream image runs as root; without capabilities that root only writes files it owns. #}
  {% set ollama = tpl.add_container(values.consts.ollama_container_name, "ollama_image") %}
  {% do ollama.set_user(0, 0) %}
  {% do ollama.set_read_only(True) %}
  {% do ollama.add_storage("/tmp", {"type": "tmpfs"}) %}
  {% do ollama.add_storage("/root/.ollama", values.storage.ollama_data) %}
  {% do perm_container.add_or_skip_action("ollama_data", values.storage.ollama_data, {"uid": 0, "gid": 0, "mode": "check"}) %}
  {% do ollama.add_network(backend_net) %}
  {% do ollama.add_network(egress_net) %}
  {% do ollama.environment.add_env("OLLAMA_HOST", "0.0.0.0:11434") %}
  {% do ollama.healthcheck.set_custom_test(["CMD", "ollama", "list"]) %}
{% endif %}

{% do perm_container.add_or_skip_action("data", values.storage.data, app_perms) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% for c in [migrate, api, worker] %}
    {% do c.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endfor %}
  {% if bundled_ollama %}
    {% do ollama.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endif %}
{% endif %}

{% do tpl.notes.add_info("Session cookies are Secure: sign in through a reverse proxy with HTTPS (docs/operations/truenas.md). The setup token for the first admin is in the logs of the api container (event setup_pending).") %}
{% do tpl.portals.add(values.network.web_port) %}

{% set result = tpl.render() %}
{% do result.networks[backend_net].update({"internal": true}) %}
{{ result | tojson }}
