images:
  # `edge` until the first release; then the release tag (e.g. "0.1.0"), see
  # docs/operations/truenas.md section 7.
  image:
    repository: ghcr.io/dusseligerdussel/ollamail-api
    tag: edge
  frontend_image:
    repository: ghcr.io/dusseligerdussel/ollamail-frontend
    tag: edge
  # Same pins as deploy/compose.yaml (scripts/check-image-pins.sh).
  postgres_image:
    repository: pgvector/pgvector
    tag: 0.8.7-pg16-bookworm
  ollama_image:
    repository: ollama/ollama
    tag: 0.35.0
  container_utils_image:
    repository: ixsystems/container-utils
    tag: "1.0.2@sha256:46eba20714c1cc6784f60e245c32c33a2d9f616e47d804694a9854248c89a992"
  postgres_upgrade_image:
    repository: ixsystems/postgres-upgrade
    tag: "1.2.20@sha256:e28bff9ef6aa9afc137d5d1303ffbc4ba7be07d3a8f5a178ce615c0cbcf4ce21"

consts:
  migrate_container_name: migrate
  api_container_name: api
  worker_container_name: worker
  frontend_container_name: frontend
  ollama_container_name: ollama
  postgres_container_name: postgres
  perms_container_name: permissions
  # Fixed user of the ollamail images (backend/Dockerfile, frontend/Dockerfile).
  app_user: 10001
  app_group: 10001
  db_name: ollamail
  db_user: ollamail
  data_path: /data
  frontend_port: 8080
