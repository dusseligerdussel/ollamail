[project]
name = "ollamail-backend"
version = "0.1.0"
description = "ollamail API and background worker"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "authlib>=1.6",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "joserfc>=1.3",
    "ldap3>=2.9.1",
    "nh3>=0.3.7",
    "num2words>=0.5.14",
    "pgvector>=0.3",
    "piper-tts>=1.3,<2",
    "procrastinate>=3.10,<4",
    "psycopg[binary]>=3.2",
    "py3langid>=0.4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=26.1.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "feedparser>=6.0.14",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.23.1",
    "ruff>=0.5",
    "types-ldap3>=2.9.13.20260827",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*", "num2words.*", "py3langid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs PostgreSQL with pgvector (skipped if unreachable, see tests/conftest.py)",
    "ollama: needs a running Ollama with a small model (skipped if unreachable)",
    "imap: needs an IMAP test server (Dovecot, skipped if unreachable, see tests/mail/imap_server.py)",
    "ldap: needs slapd (OpenLDAP server binary; skipped if not installed)",
    "piper: needs piper-tts and a voice in OLLAMAIL_TEST_PIPER_VOICES (skipped otherwise)",
]
